  <!-- Existing styles: splash, toast, view system, projector -->
  <link rel="stylesheet" href="css/style.css">

  <!-- New design-system utilities (holographic / glass / chamfer / scanlines) -->
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }

    /* Holographic panel – frosted glass + faint scanlines */
    .holographic-panel {
      background: rgba(2, 5, 16, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(60, 215, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    .holographic-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(60, 215, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.3;
    }

    .glass-panel {
      background-color: rgba(2, 5, 16, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .neon-glow-primary:hover { box-shadow: 0 0 15px rgba(0, 212, 255, 0.6); }
    .neon-border-red { border-left: 4px solid #ef4444; }

    .clip-chamfer {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .outer-glow-cyan { box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

    /* Scanline overlay (player device) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 5;
    }

    /* ── View system: redesigned views own their own layout (block) ── */
    #view-landing.active,
    #view-join.active,
    #view-host-setup.active,
    #view-lobby.active,
    #view-host-game.active,
    #view-player-game.active,
    #view-projector.active,
    #view-winner.active {
      display: block;
      padding: 0;
      min-height: 100vh;
    }

    /* Global starfield sits behind the app */
    #bg-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #app { position: relative; z-index: 1; }

    /* ── Projector (Kivetítő) HUD ─────────────────────────────── */
    #view-projector.active {
      background: #000;
      background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 100% 4px;
      height: 100vh;
      min-height: unset;
      overflow: hidden;
    }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 22s linear infinite; }

    .proj-hud-corner { position: absolute; width: 24px; height: 24px; border-color: rgba(0,212,255,0.8); border-style: solid; }
    .proj-hud-corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .proj-hud-corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .proj-hud-corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .proj-hud-corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .proj-hex {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 58px; height: 58px; flex-shrink: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: rgba(0,212,255,0.10);
    }
    .proj-hex--start   { background: rgba(0,212,255,0.05); }
    .proj-hex--end     { background: rgba(0,212,255,0.22); }
    .proj-hex--anomaly { background: rgba(255,75,75,0.16); }
    .proj-hex--trap    { background: rgba(254,181,40,0.16); }
    .proj-hex-num { font-weight: 700; font-size: 0.95rem; color: #bbc9cf; }
    .proj-hex--end .proj-hex-num, .proj-hex--start .proj-hex-num { color: #a8e8ff; }
    .proj-hex-mark { position: absolute; top: 5px; font-size: 0.7rem; }
    .proj-token-row { position: absolute; bottom: 3px; display: flex; gap: 2px; justify-content: center; }
    .proj-token {
      width: 21px; height: 21px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold;
      box-shadow: 0 0 10px currentColor; border: 1px solid rgba(255,255,255,0.5);
    }

<body class="dark bg-surface-container-lowest text-on-surface font-body-md">

  <!-- Global animated starfield (behind everything) -->
  <div id="bg-stars" aria-hidden="true">
    <canvas id="bg-shader-canvas" style="display:block;width:100%;height:100%"></canvas>
  </div>

  <div id="splash">
    <img src="img/game_logo.png" alt="RMG Astro-Activity" class="splash-logo">
  </div>

  <div id="app">
    <!-- View 1: Főmenü -->
    <div id="view-landing" class="view"></div>

    <!-- View 1/B: Csatlakozás kóddal (dedikált oldal) -->
    <div id="view-join" class="view"></div>

    <!-- View 2: Host Beállítások -->
    <div id="view-host-setup" class="view"></div>

    <!-- View 3: Váróterem (Host + Játékos) -->
    <div id="view-lobby" class="view"></div>

    <!-- View 4/A: Kivetítő – publikus táblán (window.open-nel nyílik) -->
    <div id="view-projector" class="view"></div>

    <!-- View 4/B: Host Vezérlőpult – privát -->
    <div id="view-host-game" class="view"></div>

    <!-- View 4/C: Játékos nézet – saját eszközön (aktív: látja a szót; passzív: nem) -->
    <div id="view-player-game" class="view"></div>

    <!-- View 5: Győztes Hirdetés -->
    <div id="view-winner" class="view"></div>
  </div>

  <!-- Global starfield shader -->
  <script>
    (function () {
      const canvas = document.getElementById('bg-shader-canvas');
      if (!canvas) return;
      function syncSize() {
        const w = canvas.clientWidth || window.innerWidth;
        const h = canvas.clientHeight || window.innerHeight;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncSize).observe(canvas);
      window.addEventListener('resize', syncSize);
      syncSize();

      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;
      const vs = `attribute vec2 a_position; void main(){ gl_Position = vec4(a_position,0.0,1.0); }`;
      const fs = `precision highp float;
        uniform float u_time; uniform vec2 u_resolution;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
        void main(){
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          vec2 asp = vec2(u_resolution.x / u_resolution.y, 1.0);
          vec3 color = vec3(0.007, 0.02, 0.06);
          // subtle nebula glow
          float glow = sin(uv.x * 3.0 + u_time * 0.2) * cos(uv.y * 2.0 - u_time * 0.1);
          color += vec3(0.0, 0.18, 0.36) * glow * 0.08;
          // point-star layers
          for (int layer = 0; layer < 2; layer++) {
            float scale = 38.0 + float(layer) * 64.0;
            vec2 sp = uv * asp * scale;
            vec2 cell = floor(sp);
            vec2 f = fract(sp);
            float n = hash(cell + float(layer) * 19.0);
            if (n > 0.93) {
              vec2 c = vec2(hash(cell + 1.3), hash(cell + 2.7));
              float d = length((f - c) / vec2(1.0));
              float b = smoothstep(0.07, 0.0, d) * (n - 0.93) / 0.07;
              float blink = 0.6 + 0.4 * sin(u_time * 1.5 + n * 30.0);
              color += vec3(0.85, 0.92, 1.0) * b * blink;
            }
          }
          gl_FragColor = vec4(color, 1.0);
        }`;
      function cs(t, s){ const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; }
      const prog = gl.createProgram();
      gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'a_position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      function render(t){
        if (typeof ResizeObserver === 'undefined') syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
