<!DOCTYPE html>
<html class="dark" lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Existing styles: splash, toast, view system, projector -->
  <link rel="stylesheet" href="css/style.css">

  <!-- New design-system utilities (holographic / glass / chamfer / scanlines) -->
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }

    /* Holographic panel – frosted glass + faint scanlines */
    .holographic-panel {
      background: rgba(2, 5, 16, 0.78);
      border: 1px solid rgba(60, 215, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    .holographic-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(60, 215, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.3;
    }

    .glass-panel {
      background-color: rgba(2, 5, 16, 0.78);
    }

    .neon-glow-primary:hover { box-shadow: 0 0 15px rgba(0, 212, 255, 0.6); }
    .neon-border-red { border-left: 4px solid #ef4444; }

    .clip-chamfer {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .outer-glow-cyan { box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

    /* Scanline overlay (player device) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 5;
    }

    /* ── View system: redesigned views own their own layout (block) ── */
    #view-landing.active,
    #view-join.active,
    #view-host-setup.active,
    #view-lobby.active,
    #view-host-game.active,
    #view-player-game.active,
    #view-projector.active,
    #view-winner.active {
      display: block;
      padding: 0;
      min-height: 100vh;
    }

    /* Global starfield sits behind the app. Solid dark base so the theme
       never depends on the WebGL canvas covering the viewport. As a fixed
       layer it also keeps the backdrop dark while the page scrolls. */
    #bg-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #020510; }
    #app { position: relative; z-index: 1; }

    /* ── Projector (Kivetítő) HUD ─────────────────────────────── */
    #view-projector.active {
      background: #000;
      background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 100% 4px;
      height: 100vh;
      min-height: unset;
      overflow: hidden;
    }
    .proj-hud-corner { position: absolute; width: 24px; height: 24px; border-color: rgba(0,212,255,0.8); border-style: solid; }
    .proj-hud-corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 12px 0 0 0; }
    .proj-hud-corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-radius: 0 12px 0 0; }
    .proj-hud-corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-radius: 0 0 0 12px; }
    .proj-hud-corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 12px 0; }

    /* ── Star-chart board (nodes positioned procedurally by JS) ── */
    .nebula-bg { background: radial-gradient(circle at 50% 50%, rgba(0,212,255,0.10) 0%, rgba(28,77,108,0.05) 40%, transparent 80%); filter: blur(20px); }
    .stellar-node {
      position: absolute;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(0,212,255,0.2) 0%, transparent 70%);
      border: 1px solid rgba(0,212,255,0.3);
      box-shadow: 0 0 15px rgba(0,212,255,0.1);
    }
    .stellar-node.active  { background: radial-gradient(circle at center, rgba(0,212,255,0.4) 0%, transparent 80%); border-color: rgba(0,212,255,0.8); box-shadow: 0 0 25px rgba(0,212,255,0.5), inset 0 0 10px rgba(0,212,255,0.5); }
    .stellar-node.hazard  { background: radial-gradient(circle at center, rgba(255,180,171,0.2) 0%, transparent 70%); border-color: rgba(255,180,171,0.4); box-shadow: 0 0 15px rgba(255,180,171,0.2); }
    .stellar-node.special { background: radial-gradient(circle at center, rgba(254,181,40,0.2) 0%, transparent 70%); border-color: rgba(254,181,40,0.4); box-shadow: 0 0 15px rgba(254,181,40,0.2); }
    .node-inner { background: #a8e8ff; border-radius: 50%; box-shadow: 0 0 10px #a8e8ff; }
    .stellar-node.hazard .node-inner  { background: #ffb4ab; box-shadow: 0 0 10px #ffb4ab; }
    .stellar-node.special .node-inner { background: #feb528; box-shadow: 0 0 10px #feb528; }
    .stellar-node.active .node-inner  { background: #fff; box-shadow: 0 0 20px #fff, 0 0 40px #00d4ff; }
    .constellation-line { position: absolute; height: 2px; transform-origin: left center; z-index: 0; background: linear-gradient(90deg, rgba(0,212,255,0.1), rgba(0,212,255,0.4), rgba(0,212,255,0.1)); box-shadow: 0 0 8px rgba(0,212,255,0.2); }
    .proj-token { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; box-shadow: 0 0 12px currentColor; z-index: 10; border: 2px solid rgba(255,255,255,0.85); }
    .proj-node-label { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none; line-height: 1; }

    /* Astrolabe timer */
    .astrolabe { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
    .astrolabe-ring { position: absolute; border-radius: 50%; }
    .astrolabe-ring-1 { width: 100%; height: 100%; border: 2px solid rgba(254,181,40,0.2); border-top-color: rgba(254,181,40,0.8); }
    .astrolabe-ring-2 { width: 85%; height: 85%; border: 1px solid rgba(0,212,255,0.3); border-bottom-color: rgba(0,212,255,0.8); }
    .astrolabe-ring-3 { width: 70%; height: 70%; border: 2px dotted rgba(254,181,40,0.4); }
    @keyframes proj-spin { to { transform: rotate(360deg); } }
    @keyframes proj-spin-rev { to { transform: rotate(-360deg); } }
    @keyframes proj-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .proj-spin-slow { animation: proj-spin 12s linear infinite; }
    .proj-spin-rev-slow { animation: proj-spin-rev 15s linear infinite; }
    .proj-float { animation: proj-float 6s ease-in-out infinite; }
  </style>
</head>
<body class="dark bg-surface-container-lowest text-on-surface font-body-md">

  <!-- Global animated starfield (behind everything) -->
  <div id="bg-stars" aria-hidden="true">
    <canvas id="bg-shader-canvas" style="display:block;width:100%;height:100%"></canvas>
  </div>

  <div id="splash">
    <img src="img/game_logo.png" alt="RMG Astro-Activity" class="splash-logo">
  </div>

  <div id="app">
    <!-- View 1: Főmenü -->
    <div id="view-landing" class="view"></div>

    <!-- View 1/B: Csatlakozás kóddal (dedikált oldal) -->
    <div id="view-join" class="view"></div>

    <!-- View 2: Host Beállítások -->
    <div id="view-host-setup" class="view"></div>

    <!-- View 3: Váróterem (Host + Játékos) -->
    <div id="view-lobby" class="view"></div>

    <!-- View 4/A: Kivetítő – publikus táblán (window.open-nel nyílik) -->
    <div id="view-projector" class="view"></div>

    <!-- View 4/B: Host Vezérlőpult – privát -->
    <div id="view-host-game" class="view"></div>

    <!-- View 4/C: Játékos nézet – saját eszközön (aktív: látja a szót; passzív: nem) -->
    <div id="view-player-game" class="view"></div>

    <!-- View 5: Győztes Hirdetés -->
    <div id="view-winner" class="view"></div>
  </div>

  <!-- Global starfield shader -->
  <script>
    (function () {
      const canvas = document.getElementById('bg-shader-canvas');
      if (!canvas) return;
      function syncSize() {
        const w = canvas.clientWidth || window.innerWidth;
        const h = canvas.clientHeight || window.innerHeight;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncSize).observe(canvas);
      window.addEventListener('resize', syncSize);
      syncSize();

      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { canvas.style.display = 'none'; return; }
      // If the GPU context is lost, hide the canvas so the dark #bg-stars shows.
      canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); canvas.style.display = 'none'; }, false);
      const vs = `attribute vec2 a_position; void main(){ gl_Position = vec4(a_position,0.0,1.0); }`;
      const fs = `precision highp float;
        uniform float u_time; uniform vec2 u_resolution;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
        void main(){
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          vec2 asp = vec2(u_resolution.x / u_resolution.y, 1.0);
          vec3 color = vec3(0.007, 0.02, 0.06);
          // subtle nebula glow
          float glow = sin(uv.x * 3.0 + u_time * 0.2) * cos(uv.y * 2.0 - u_time * 0.1);
          color += vec3(0.0, 0.18, 0.36) * glow * 0.08;
          // point-star layers
          for (int layer = 0; layer < 2; layer++) {
            float scale = 38.0 + float(layer) * 64.0;
            vec2 sp = uv * asp * scale;
            vec2 cell = floor(sp);
            vec2 f = fract(sp);
            float n = hash(cell + float(layer) * 19.0);
            if (n > 0.93) {
              vec2 c = vec2(hash(cell + 1.3), hash(cell + 2.7));
              float d = length((f - c) / vec2(1.0));
              float b = smoothstep(0.07, 0.0, d) * (n - 0.93) / 0.07;
              float blink = 0.6 + 0.4 * sin(u_time * 1.5 + n * 30.0);
              color += vec3(0.85, 0.92, 1.0) * b * blink;
            }
          }
          gl_FragColor = vec4(color, 1.0);
        }`;
      function cs(t, s){ const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; }
      const prog = gl.createProgram();
      gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'a_position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      function render(t){
        if (typeof ResizeObserver === 'undefined') syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
