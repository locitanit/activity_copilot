<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMG Astro-Activity</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash">
    <img src="img/game_logo.png" alt="RMG Astro-Activity" class="splash-logo">
  </div>

  <div id="app">
    <!-- View 1: Főmenü -->
    <div id="view-landing" class="view"></div>

    <!-- View 2: Host Beállítások -->
    <div id="view-host-setup" class="view"></div>

    <!-- View 3: Váróterem (Host + Játékos) -->
    <div id="view-lobby" class="view"></div>

    <!-- View 4/A: Kivetítő – publikus táblán (window.open-nel nyílik) -->
    <div id="view-projector" class="view"></div>

    <!-- View 4/B: Host Vezérlőpult – privát -->
    <div id="view-host-game" class="view"></div>

    <!-- View 4/C: Játékos nézet – saját eszközön (aktív: látja a szót; passzív: nem) -->
    <div id="view-player-game" class="view"></div>

    <!-- View 5: Győztes Hirdetés -->
    <div id="view-winner" class="view"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
